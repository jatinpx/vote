<title>Advocate Canvass Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4;
  --surface:#ffffff;
  --surface-2:#f5f7f9;
  --border:#dde2e8;
  --border-strong:#c7ced6;
  --ink:#1a2233;
  --ink-muted:#5b6472;
  --ink-faint:#8992a0;
  --accent:#1f4e5f;
  --accent-ink:#ffffff;
  --accent-soft:#e3edf0;
  --accent-soft-ink:#1f4e5f;
  --favor:#2f7d4f;
  --favor-soft:#e3f3e8;
  --against:#b23a3a;
  --against-soft:#fbe9e9;
  --fifty:#a9762f;
  --fifty-soft:#f6ecdd;
  --contacted-yes:#1f4e5f;
  --contacted-no:#8a929c;
  --shadow:rgba(23,33,43,0.10);
  --city-flag:#8a5fb0;
  --city-flag-soft:#f1eaf7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151b;
    --surface:#1a2029;
    --surface-2:#20262f;
    --border:#2c333d;
    --border-strong:#3a424e;
    --ink:#e8ecf0;
    --ink-muted:#a3aebb;
    --ink-faint:#6d7683;
    --accent:#7ec2d4;
    --accent-ink:#0b1418;
    --accent-soft:#1e3138;
    --accent-soft-ink:#9adbe9;
    --favor:#5fbd8b;
    --favor-soft:#183226;
    --against:#e08787;
    --against-soft:#3a2020;
    --fifty:#d9ab5b;
    --fifty-soft:#3a2f18;
    --contacted-yes:#7ec2d4;
    --contacted-no:#5b6472;
    --shadow:rgba(0,0,0,0.45);
    --city-flag:#c19bdf;
    --city-flag-soft:#2a2035;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b;
  --surface:#1a2029;
  --surface-2:#20262f;
  --border:#2c333d;
  --border-strong:#3a424e;
  --ink:#e8ecf0;
  --ink-muted:#a3aebb;
  --ink-faint:#6d7683;
  --accent:#7ec2d4;
  --accent-ink:#0b1418;
  --accent-soft:#1e3138;
  --accent-soft-ink:#9adbe9;
  --favor:#5fbd8b;
  --favor-soft:#183226;
  --against:#e08787;
  --against-soft:#3a2020;
  --fifty:#d9ab5b;
  --fifty-soft:#3a2f18;
  --contacted-yes:#7ec2d4;
  --contacted-no:#5b6472;
  --shadow:rgba(0,0,0,0.45);
  --city-flag:#c19bdf;
  --city-flag-soft:#2a2035;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  -webkit-font-smoothing:antialiased;
  line-height:1.45;
}
::selection{background:var(--accent-soft);}
a{color:var(--accent);}
button{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums;}

header.top{
  position:sticky; top:0; z-index:20;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 0 var(--shadow);
}
.top-inner{max-width:1180px; margin:0 auto; padding:18px 24px 14px;}
.eyebrow{
  font-family:"Public Sans",sans-serif; font-size:11.5px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; color:var(--ink-faint);
  margin:0 0 6px;
}
.title-row{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; justify-content:space-between;}
h1.brand{
  font-family:"Fraunces",Georgia,serif; font-weight:600; font-size:28px;
  margin:0; color:var(--ink); letter-spacing:-.01em; text-wrap:balance;
}
.subtitle{color:var(--ink-muted); font-size:14px; margin:4px 0 0; max-width:62ch;}

.nav-row{
  max-width:1180px; margin:14px auto 0; padding:0 24px 0;
  display:flex; align-items:center; gap:18px; flex-wrap:wrap;
}
.tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; border:1px solid var(--border);}
.tab{
  border:none; background:transparent; padding:7px 14px; border-radius:7px;
  font-size:13.5px; font-weight:600; color:var(--ink-muted); cursor:pointer;
}
.tab.active{background:var(--surface); color:var(--accent); box-shadow:0 1px 2px var(--shadow);}
.crumb{
  border:none; background:transparent; color:var(--accent); font-weight:600; font-size:14px;
  cursor:pointer; padding:6px 2px; display:flex; align-items:center; gap:6px;
}
.search-wrap{flex:1; min-width:220px; max-width:420px; margin-left:auto; position:relative;}
.search-wrap input{
  width:100%; padding:8px 12px 8px 32px; border-radius:8px; border:1px solid var(--border-strong);
  background:var(--surface-2); color:var(--ink); font-size:13.5px;
}
.search-wrap input::placeholder{color:var(--ink-faint);}
.search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:.55;}
.nav-row-spacer{height:14px;}

main{max-width:1180px; margin:0 auto; padding:26px 24px 80px;}

.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:30px;}
@media (max-width:860px){.stat-grid{grid-template-columns:repeat(2,1fr);}}
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:12px;
  padding:16px 18px; display:flex; flex-direction:column; gap:6px;
}
.stat-label{font-size:12px; font-weight:600; color:var(--ink-muted); text-transform:uppercase; letter-spacing:.05em;}
.stat-value{font-family:"Fraunces",serif; font-size:30px; font-weight:600; font-variant-numeric:tabular-nums;}
.stat-sub{font-size:12.5px; color:var(--ink-faint);}
.bar{height:7px; border-radius:5px; background:var(--surface-2); overflow:hidden; display:flex; margin-top:2px;}
.bar > span{height:100%; display:block;}
.legend{display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; font-size:11.5px; color:var(--ink-muted);}
.legend .dot{width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:4px; vertical-align:middle;}

.section-head{display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:8px 0 14px; flex-wrap:wrap;}
.section-head h2{font-family:"Fraunces",serif; font-weight:600; font-size:20px; margin:0;}
.section-head .count{color:var(--ink-faint); font-size:13px;}

.village-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px;}
.village-card{
  text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:11px;
  padding:14px 16px; cursor:pointer; display:flex; flex-direction:column; gap:8px;
  transition:border-color .12s, box-shadow .12s; width:100%;
}
.village-card:hover{border-color:var(--border-strong); box-shadow:0 2px 8px var(--shadow);}
.village-card.city{border-color:var(--city-flag); background:linear-gradient(180deg,var(--city-flag-soft),var(--surface) 65%);}
.vc-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
.vc-name{font-weight:700; font-size:15px; line-height:1.25;}
.vc-count{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; color:var(--ink-muted);
  background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:2px 6px; white-space:nowrap;
}
.vc-progress{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-faint);}

.empty{color:var(--ink-faint); font-size:14px; padding:30px 4px; text-align:center;}

.table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px; background:var(--surface);}
table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:920px;}
thead th{
  text-align:left; padding:10px 12px; background:var(--surface-2); border-bottom:1px solid var(--border);
  font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-muted);
  position:sticky; top:0;
}
tbody td{padding:10px 12px; border-bottom:1px solid var(--border); vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr.flag-favor{box-shadow:inset 3px 0 0 var(--favor);}
tbody tr.flag-against{box-shadow:inset 3px 0 0 var(--against);}
tbody tr.flag-fifty{box-shadow:inset 3px 0 0 var(--fifty);}
tbody tr.contacted-no{background:var(--surface-2);}
td.name-cell{min-width:190px;}
.name-row{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
.name-actions{display:flex; align-items:center; gap:6px; flex:none;}
.name-actions .contact-btn{padding:4px 9px; font-size:11.5px; min-width:0;}
.name-row .note-btn{width:24px; height:24px; border-radius:7px; flex:none;}
.name-row .note-btn svg{width:12px; height:12px;}
.adv-name{font-weight:600;}
.adv-relation{color:var(--ink-faint); font-size:12px; margin-top:1px;}
.mob-link{color:var(--ink); text-decoration:none;}
.mob-link:hover{color:var(--accent); text-decoration:underline;}
.no-mob{color:var(--ink-faint);}
.loc-text{color:var(--ink-muted); font-size:12.5px;}

.contact-btn{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-muted);
  border-radius:7px; padding:5px 10px; font-size:12.5px; font-weight:700; cursor:pointer; min-width:64px;
}
.contact-btn.yes{background:var(--accent-soft); color:var(--accent-soft-ink); border-color:var(--accent);}
.contact-btn.no{background:var(--surface-2); color:var(--ink-faint); border-color:var(--border);}

.stance-cell{text-align:center;}
.stance-group{display:flex; gap:6px; align-items:center; justify-content:center; flex-wrap:wrap;}
.stance-btn{
  border:1.5px solid var(--border-strong); border-radius:16px; background:var(--surface);
  color:var(--ink-muted); cursor:pointer; display:inline-flex; align-items:center; gap:5px;
  padding:5px 10px 5px 8px; font-size:12px; font-weight:700; white-space:nowrap;
}
.stance-btn .stance-dot{
  width:16px; height:16px; border-radius:50%; border:1.5px solid var(--border-strong);
  display:inline-flex; align-items:center; justify-content:center; flex:none;
}
.stance-btn.on-favor{background:var(--favor-soft); color:var(--favor); border-color:var(--favor);}
.stance-btn.on-favor .stance-dot{background:var(--favor); border-color:var(--favor);}
.stance-btn.on-against{background:var(--against-soft); color:var(--against); border-color:var(--against);}
.stance-btn.on-against .stance-dot{background:var(--against); border-color:var(--against);}
.stance-btn.on-fifty{background:var(--fifty-soft); color:var(--fifty); border-color:var(--fifty);}
.stance-btn.on-fifty .stance-dot{background:var(--fifty); border-color:var(--fifty);}
.stance-btn svg{opacity:0; width:10px; height:10px;}
.stance-btn.on-favor svg, .stance-btn.on-against svg, .stance-btn.on-fifty svg{opacity:1; stroke:white;}

.dq-card{background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:14px 16px; margin-bottom:10px;}
.dq-title{font-weight:700; font-size:13.5px; margin-bottom:8px; display:flex; gap:8px; align-items:center;}
.dq-code{background:var(--surface-2); border:1px solid var(--border); border-radius:6px; padding:1px 6px; font-size:12px;}
.dq-row{display:flex; justify-content:space-between; align-items:center; padding:6px 0; font-size:13px; border-top:1px dashed var(--border);}
.dq-row:first-of-type{border-top:none;}
.dq-link{border:none; background:transparent; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer;}
.dq-note{color:var(--ink-muted); font-size:13px; margin:0 0 14px; max-width:70ch;}
.dq-card.resolved{opacity:.72;}
.dq-radio-row{cursor:pointer; gap:10px;}
.dq-radio-row input[type="radio"]{width:16px; height:16px; accent-color:var(--accent); flex:none; cursor:pointer;}
.dq-radio-label{flex:1; font-size:13px;}
.dq-actions{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.dq-btn{border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:12.5px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer;}
.dq-btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent);}
.dq-badge{background:var(--surface-2); border:1px solid var(--border); color:var(--ink-muted); font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:5px;}
.dq-badge-merged{background:var(--favor-soft); color:var(--favor); border-color:var(--favor);}

.note-btn{
  width:30px; height:30px; border-radius:8px; border:1.5px solid var(--border-strong);
  background:var(--surface); color:var(--ink-faint); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; position:relative;
}
.note-btn.has-note{background:var(--accent-soft); color:var(--accent-soft-ink); border-color:var(--accent);}
.note-btn .note-dot{
  position:absolute; top:-3px; right:-3px; width:8px; height:8px; border-radius:50%;
  background:var(--accent); display:none;
}
.note-btn.has-note .note-dot{display:block;}

.modal-overlay{
  position:fixed; inset:0; background:rgba(10,14,18,0.5); z-index:100;
  display:flex; align-items:center; justify-content:center; padding:16px;
}
.modal-overlay[hidden]{display:none;}
.modal-box{
  background:var(--surface); border-radius:14px; border:1px solid var(--border);
  width:100%; max-width:440px; padding:18px 20px 20px; box-shadow:0 12px 40px var(--shadow);
}
.modal-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:12px;}
.modal-title{font-family:"Fraunces",serif; font-weight:600; font-size:17px; line-height:1.3;}
.modal-sub{color:var(--ink-faint); font-size:12.5px; margin-top:2px;}
.modal-close{
  border:none; background:var(--surface-2); color:var(--ink-muted); width:30px; height:30px;
  border-radius:8px; font-size:18px; line-height:1; cursor:pointer; flex:none;
}
.notes-textarea{
  width:100%; min-height:100px; resize:vertical; border:1px solid var(--border-strong);
  border-radius:9px; background:var(--surface-2); color:var(--ink); padding:10px 12px;
  font-family:inherit; font-size:14px; line-height:1.5;
}
.modal-actions{display:flex; justify-content:space-between; gap:10px; margin-top:14px;}

.edit-box{max-width:560px;}
.edit-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px 14px;}
.edit-field{display:flex; flex-direction:column; gap:5px; font-size:12px; font-weight:600; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.03em;}
.edit-field-wide{grid-column:1 / -1;}
.edit-field input{
  border:1px solid var(--border-strong); border-radius:8px; background:var(--surface-2); color:var(--ink);
  padding:8px 10px; font-family:inherit; font-size:14px; font-weight:400; text-transform:none; letter-spacing:normal;
}
.edit-field input:focus{outline:2px solid var(--accent); outline-offset:1px;}
.edit-hint{font-size:12px; color:var(--accent); margin-top:10px; min-height:14px;}

.records-btn{
  border:1px solid var(--border-strong); border-radius:8px; background:var(--surface); color:var(--ink-muted);
  padding:5px 11px; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap;
}
.records-btn.edited{background:var(--accent-soft); color:var(--accent-soft-ink); border-color:var(--accent);}
th.sortable{cursor:pointer; user-select:none;}
th.sortable:hover{color:var(--ink);}
th.sortable .sort-arrow{opacity:.35; margin-left:4px; font-size:10px;}
th.sortable.sort-active .sort-arrow{opacity:1; color:var(--accent);}
td.village-cell{font-size:13px; color:var(--ink-muted);}

footer.appfoot{max-width:1180px; margin:0 auto; padding:0 24px 40px; color:var(--ink-faint); font-size:12px;}

/* ---------- mobile ---------- */
@media (max-width: 700px){
  body{font-size:16px;}
  .top-inner{padding:16px 16px 14px;}
  .eyebrow{font-size:11.5px;}
  h1.brand{font-size:25px;}
  .subtitle{font-size:14.5px; line-height:1.5;}
  .nav-row{padding:0 16px 0; margin-top:12px; gap:10px;}
  .search-wrap{order:3; flex-basis:100%; max-width:none;}
  .search-wrap input{font-size:16px; padding:12px 12px 12px 36px;}
  .search-wrap svg{width:16px; height:16px;}
  .tabs{order:1;}
  .tab{font-size:14.5px; padding:9px 15px;}
  .crumb{order:1; font-size:16px;}
  main{padding:18px 16px 70px;}
  .stat-grid{grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  .stat-card{padding:14px 15px;}
  .stat-label{font-size:12.5px;}
  .stat-value{font-size:26px;}
  .stat-sub{font-size:13px;}
  .legend{font-size:13px; gap:12px;}
  .village-grid{grid-template-columns:1fr; gap:10px;}
  .village-card{padding:15px 16px;}
  .vc-name{font-size:16.5px;}
  .vc-count{font-size:13px; padding:3px 8px;}
  .vc-progress{font-size:13px;}
  .section-head h2{font-size:19px;}
  .section-head .count{font-size:13.5px;}

  .table-wrap{border:none; background:transparent; overflow-x:visible;}
  table{min-width:0; font-size:15.5px;}
  thead{display:none;}
  tbody, tbody tr, tbody td{display:block; width:100%;}
  tbody tr{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px 12px; margin-bottom:12px; box-shadow:0 1px 2px var(--shadow);
  }
  tbody tr.flag-favor{box-shadow:0 1px 2px var(--shadow), inset 3px 0 0 var(--favor);}
  tbody tr.flag-against{box-shadow:0 1px 2px var(--shadow), inset 3px 0 0 var(--against);}
  tbody tr.flag-fifty{box-shadow:0 1px 2px var(--shadow), inset 3px 0 0 var(--fifty);}
  tbody td{border-bottom:none; padding:4px 0;}
  td.sr-cell{display:none;}
  td.enr-cell{font-size:13px; color:var(--ink-faint); padding-bottom:4px;}
  td.enr-cell::before{content:none;}
  td.name-cell{padding:2px 0 10px;}
  td.name-cell .adv-name{font-size:18px;}
  td.name-cell .adv-relation{font-size:14.5px; margin-top:2px;}
  .name-row .note-btn{width:34px; height:34px;}
  .name-row .note-btn svg{width:15px; height:15px;}
  .name-actions .contact-btn{min-height:34px; min-width:0; padding:6px 11px; font-size:13px;}
  td.mono{font-size:15.5px;}
  td.loc-text{font-size:14.5px;}
  td[data-label]:not(.name-cell):not(.enr-cell):not(.status-cell)::before{
    content: attr(data-label) ": "; font-weight:600; color:var(--ink-faint);
    font-size:12.5px; text-transform:uppercase; letter-spacing:.03em; margin-right:5px;
  }
  td.status-cell{
    display:inline-flex; flex-direction:column; align-items:center; gap:6px;
    width:auto; padding:10px 12px 4px; margin:8px 6px 0 0; vertical-align:top;
  }
  td.status-cell::before{
    content: attr(data-label); font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--ink-faint);
  }
  .contact-btn{min-height:42px; min-width:76px; font-size:15px;}
  .stance-btn{padding:8px 13px 8px 10px; font-size:13.5px; min-height:38px;}
  .stance-btn .stance-dot{width:19px; height:19px;}
  .stance-btn svg{width:11px; height:11px;}
  .note-btn{width:40px; height:40px;}
  .note-btn svg{width:17px; height:17px;}

  .dq-note{font-size:14.5px;}
  .dq-title{font-size:15px;}
  .dq-radio-label{font-size:14.5px;}
  .dq-badge{font-size:12px;}
  .dq-actions{flex-direction:column;}
  .dq-btn{width:100%; padding:11px 12px; min-height:42px; font-size:14.5px;}
  .dq-radio-row{flex-wrap:wrap;}
  .dq-radio-row .dq-link{margin-left:auto; font-size:13.5px;}

  .modal-box{width:calc(100% - 24px); max-width:none;}
  .notes-textarea{font-size:16px; min-height:120px;}
  .edit-grid{grid-template-columns:1fr;}
  .edit-field input{font-size:16px; padding:10px 11px;}
  .records-btn{min-height:34px; font-size:13px; padding:6px 12px;}
}
@media (max-width: 380px){
  h1.brand{font-size:22px;}
  .stat-grid{grid-template-columns:1fr;}
}
</style>

<header class="top">
  <div class="top-inner">
    <p class="eyebrow">District Bar Association, Charkhi Dadri &middot; Voter List 2026</p>
    <div class="title-row">
      <div>
        <h1 class="brand">Advocate Canvass Ledger</h1>
        <p class="subtitle" id="subtitleText"></p>
      </div>
    </div>

const TOTAL = DATA.length;

const byId = new Map(DATA.map(r => [r.id, r]));

// ---------- record edits overlay ----------
const EDITS_KEY = 'act_edits_v1';
let edits = {};
try { edits = JSON.parse(localStorage.getItem(EDITS_KEY) || '{}'); } catch(e) { edits = {}; }
function saveEdits(){ try { localStorage.setItem(EDITS_KEY, JSON.stringify(edits)); } catch(e) {} }
function effRec(id){
  const base = byId.get(id);
  if (!base) return base;
  const e = edits[id];
  return e ? { ...base, ...e } : base;
}
function isEdited(id){ return Object.prototype.hasOwnProperty.call(edits, id); }

let villageMap = new Map();
let villageNames = [];
function buildVillageIndex(){
  villageMap = new Map();
  for (const r of DATA) {
    const eff = effRec(r.id);
    if (!villageMap.has(eff.village)) villageMap.set(eff.village, []);
    villageMap.get(eff.village).push(eff);
  }
  villageNames = Array.from(villageMap.keys()).sort((a,b)=>a.localeCompare(b));
}
buildVillageIndex();

// ---------- persistence ----------
const STORE_KEY = 'act_state_v1';
let state = {};
try { state = JSON.parse(localStorage.getItem(STORE_KEY) || '{}'); } catch(e) { state = {}; }
function saveState(){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e) {}
}
function getRec(id){ return state[id] || {}; }
function pruneEmpty(id){
  const r = state[id];
  if (r && !r.c && !r.s && !r.n) delete state[id];
}
function setContacted(id, val){
  const cur = getRec(id);
  const next = (cur.c === val) ? undefined : val;
  state[id] = { ...cur, c: next };
  pruneEmpty(id);
  saveState();
}
function setStance(id, val){
  const cur = getRec(id);
  const next = (cur.s === val) ? undefined : val;
  state[id] = { ...cur, s: next };
  pruneEmpty(id);
  saveState();
}

// ---------- data quality: merge / dismiss duplicates ----------
const DQ_KEY = 'act_dq_v1';
let dq = { merged: {}, dismissed: {} };
try {
  const loaded = JSON.parse(localStorage.getItem(DQ_KEY) || '{}');
  dq = { merged: loaded.merged || {}, dismissed: loaded.dismissed || {} };
} catch(e) {}
function saveDQ(){
  try { localStorage.setItem(DQ_KEY, JSON.stringify(dq)); } catch(e) {}
}
function isMerged(id){ return Object.prototype.hasOwnProperty.call(dq.merged, id); }
function activeList(list){ return list.filter(r => !isMerged(r.id)); }
function mergeGroup(groupKey, keeperId, allIds){
  for (const dupId of allIds) {
    if (dupId === keeperId) continue;
    dq.merged[dupId] = keeperId;
    const dupState = state[dupId];
    if (dupState) {
      const keeperState = getRec(keeperId);
      const merged = { ...keeperState };
      if (!merged.c && dupState.c) merged.c = dupState.c;
      if (!merged.s && dupState.s) merged.s = dupState.s;
      state[keeperId] = merged;
    }
    delete state[dupId];
  }
  dq.dismissed[groupKey] = true;
  saveDQ();
  saveState();
}
function dismissGroup(groupKey){
  dq.dismissed[groupKey] = true;
  saveDQ();
}
function undoGroup(groupKey, allIds){
  for (const id of allIds) delete dq.merged[id];
  delete dq.dismissed[groupKey];
  saveDQ();
}

let currentView = 'overview';
let currentVillage = null;
let searchText = '';

function parseHash(){
  const h = decodeURIComponent(location.hash.slice(1) || '');
  if (h.startsWith('village/')) {
    currentView = 'village';
    currentVillage = h.slice('village/'.length);
  } else if (h === 'dataquality') {
    currentView = 'dataquality';
    currentVillage = null;
  } else if (h === 'records') {
    currentView = 'records';
    currentVillage = null;
  } else {
    currentView = 'overview';
    currentVillage = null;
  }
}

window.addEventListener('hashchange', () => { parseHash(); searchText=''; document.getElementById('searchBox').value=''; render(); });

// ---------- helpers ----------
function esc(s){
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function stanceCounts(records){
  let favor=0, against=0, fifty=0, unset=0;
  for (const r of records) {
    const s = getRec(r.id).s;
    if (s==='favor') favor++; else if (s==='against') against++; else if (s==='fifty') fifty++; else unset++;
  }
  return {favor, against, fifty, unset, total: records.length};
}
function contactedCounts(records){
  let yes=0, no=0, unset=0;
  for (const r of records) {
    const c = getRec(r.id).c;
    if (c==='y') yes++; else if (c==='n') no++; else unset++;
  }
  return {yes, no, unset, total: records.length};
}
function stanceBar(counts){
  const pct = n => counts.total ? (n/counts.total*100) : 0;
  return `<div class="bar">
    <span style="width:${pct(counts.favor)}%;background:var(--favor)"></span>
    <span style="width:${pct(counts.against)}%;background:var(--against)"></span>
    <span style="width:${pct(counts.fifty)}%;background:var(--fifty)"></span>
    <span style="width:${pct(counts.unset)}%;background:var(--border-strong)"></span>
  </div>`;
}

function matchesSearch(r, q){
  if (!q) return true;
  q = q.toLowerCase();
  const eff = effRec(r.id) || r;
  return (eff.name+' '+eff.relation+' '+eff.enrollmentNo+' '+eff.mobile+' '+eff.village+' '+eff.locality).toLowerCase().includes(q);
}

    </div>
  </div>`;

  let names = villageNames;
  if (q) {
    names = villageNames.filter(name => {
      if (name.toLowerCase().includes(q)) return true;
      return activeList(villageMap.get(name)).some(r => matchesSearch(r, q));
    });
  }
  // pin city first
  names = names.slice().sort((a,b)=>{
    if (a==='Charkhi Dadri City') return -1;
    if (b==='Charkhi Dadri City') return 1;
    return a.localeCompare(b);
  });

  html += `<div class="section-head"><h2>Villages &amp; Localities</h2><span class="count">${names.length.toLocaleString()} shown</span></div>`;

  if (!names.length) {
    html += `<div class="empty">No village or advocate matches &ldquo;${esc(searchText)}&rdquo;.</div>`;
  } else {
    html += `<div class="village-grid">`;
    for (const name of names) {
      const recs = activeList(villageMap.get(name));
      if (!recs.length) continue;
      const cc = contactedCounts(recs);

  container.querySelectorAll('.village-card').forEach(btn => {
    btn.addEventListener('click', () => { location.hash = 'village/' + encodeURIComponent(btn.dataset.village); });
  });
}

// ---------- render: village ----------
function renderVillage(container, villageName){
  const allRecs = villageMap.get(villageName);
  if (!allRecs) {
    container.innerHTML = `<div class="empty">Unknown village &ldquo;${esc(villageName)}&rdquo;. <a href="#/">Back to overview</a></div>`;
    return;
  }
  const recs = activeList(allRecs);
  const isCity = villageName === 'Charkhi Dadri City';
  const q = searchText.trim().toLowerCase();
  const shown = q ? recs.filter(r => matchesSearch(r,q)) : recs;
  const cc = contactedCounts(recs);
  const sc = stanceCounts(recs);

  let html = `<div class="section-head" style="margin-bottom:6px;">
    <h2>${esc(villageName)}</h2>

    <div style="min-width:180px;"><div class="stat-label" style="margin-bottom:4px;">Contacted</div><div class="mono" style="font-size:14px;">${cc.yes} yes &middot; ${cc.no} no &middot; ${cc.unset} pending</div></div>
    <div style="min-width:220px;flex:1;max-width:320px;"><div class="stat-label" style="margin-bottom:4px;">Leaning</div>${stanceBar(sc)}</div>
  </div>`;

  if (!shown.length) {
    html += `<div class="empty">No advocates match &ldquo;${esc(searchText)}&rdquo; in ${esc(villageName)}.</div>`;
  } else {
    html += `<div class="table-wrap"><table><thead><tr>
      <th>#</th><th>Enrollment No.</th><th>Advocate</th><th>Mobile</th>${isCity?'<th>Locality</th>':''}
      <th>Stance</th>
    </tr></thead><tbody>`;
    shown.forEach((r, i) => {
      const eff = effRec(r.id);

      const flagClass = rec.s ? 'flag-'+rec.s : '';
      const contactedClass = rec.c === 'n' ? 'contacted-no' : '';
      const check = `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;

      html += `<tr class="${flagClass} ${contactedClass}" data-id="${r.id}">
        <td class="sr-cell mono" data-label="#" style="color:var(--ink-faint)">${i+1}</td>
        <td class="enr-cell mono" data-label="Enrollment No." style="font-size:12.5px;">${esc(eff.enrollmentNo || '&mdash;')}</td>
        <td class="name-cell" data-label="Advocate"><div class="name-row"><div><div class="adv-name">${esc(eff.name)}</div><div class="adv-relation">${esc(eff.relation)}</div></div><div class="name-actions"><button class="contact-btn ${rec.c==='y'?'yes':rec.c==='n'?'no':''}" data-act="contact" data-val="y" data-id2="${r.id}">${rec.c==='y'?'Yes':rec.c==='n'?'No':'&mdash;'}</button><button class="note-btn ${rec.n?'has-note':''}" data-act="notes" data-id2="${r.id}" title="${rec.n?'Edit note':'Add note'}">${noteIcon}<span class="note-dot"></span></button></div></div></td>
        <td class="mono" data-label="Mobile">${eff.mobile ? `<a class="mob-link" href="tel:${esc(eff.mobile)}">${esc(eff.mobile)}</a>` : '<span class="no-mob">&mdash;</span>'}</td>

          <button class="stance-btn ${rec.s==='fifty'?'on-fifty':''}" data-act="stance" data-val="fifty" data-id2="${r.id}" title="Not Sure"><span class="stance-dot">${check}</span>Not Sure</button>
        </div></td>

    });

  });
}

    html += `<div class="table-wrap"><table><thead><tr>
      <th>#</th>
      ${RECORD_COLUMNS.map(c => `<th class="sortable ${key===c.key?'sort-active':''}" data-sort="${c.key}">${c.label}<span class="sort-arrow">${key===c.key ? (dir==='asc'?'&#9650;':'&#9660;') : '&#9650;'}</span></th>`).join('')}
      <th>Locality</th><th>Edit</th>
    </tr></thead><tbody>`;
    list.forEach((r, i) => {
      html += `<tr data-id="${r.id}">
        <td class="sr-cell mono" data-label="#" style="color:var(--ink-faint)">${i+1}</td>
        <td class="enr-cell mono" data-label="Enrollment No." style="font-size:12.5px;">${esc(r.enrollmentNo || '&mdash;')}</td>
        <td class="name-cell" data-label="Advocate"><div class="adv-name">${esc(r.name)}</div><div class="adv-relation">${esc(r.relation)}</div></td>
        <td class="village-cell" data-label="Village / City">${esc(r.village)}</td>
        <td class="mono" data-label="Mobile">${r.mobile ? `<a class="mob-link" href="tel:${esc(r.mobile)}">${esc(r.mobile)}</a>` : '<span class="no-mob">&mdash;</span>'}</td>
        <td class="loc-text" data-label="Locality">${esc(r.locality)}</td>
        <td class="status-cell" data-label="Edit"><button class="records-btn ${isEdited(r.id)?'edited':''}" data-act="edit" data-id2="${r.id}">${isEdited(r.id)?'Edited':'Edit'}</button></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }
  container.innerHTML = html;

  container.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const k = th.dataset.sort;
      if (recordsSort.key === k) recordsSort.dir = recordsSort.dir === 'asc' ? 'desc' : 'asc';
      else recordsSort = { key: k, dir: 'asc' };
      renderRecords(container);
    });
  });
  container.querySelectorAll('[data-act="edit"]').forEach(btn => {
    btn.addEventListener('click', () => { openEdit(Number(btn.dataset.id2)); });
  });
}

// ---------- render: data quality ----------
function buildDupGroups(field, prefix){
  const groups = new Map();
  for (const r of DATA) {
    const key = r[field];
    if (!key) continue;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  return Array.from(groups.entries())
    .filter(([,v]) => v.length > 1)
    .map(([key, list]) => ({ groupKey: prefix + ':' + key, key, list }));
}

function dqGroupCard(group, subtitleFn){
  const { groupKey, list } = group;
  const ids = list.map(r => r.id);
  const idsAttr = ids.join(',');
  const mergedAway = ids.filter(id => isMerged(id));
  const isDismissed = !!dq.dismissed[groupKey];

  if (isDismissed) {
    if (mergedAway.length) {
      const keeperId = dq.merged[mergedAway[0]];
      const keeper = byId.get(keeperId);
      return `<div class="dq-card resolved">
        <div class="dq-title">${subtitleFn(group)} <span class="dq-badge dq-badge-merged">Merged</span></div>
        <div class="dq-row"><span>Kept as: <strong>${esc(keeper ? keeper.name : '#'+keeperId)}</strong> &mdash; <span style="color:var(--ink-faint)">${esc(keeper ? keeper.village : '')}</span></span></div>
        <div class="dq-actions"><button class="dq-btn" data-act="undo" data-groupkey="${esc(groupKey)}" data-ids="${idsAttr}">Undo merge</button></div>
      </div>`;
    }
    return `<div class="dq-card resolved">
      <div class="dq-title">${subtitleFn(group)} <span class="dq-badge">Not a duplicate</span></div>
      <div class="dq-actions"><button class="dq-btn" data-act="undo" data-groupkey="${esc(groupKey)}" data-ids="${idsAttr}">Undo</button></div>
    </div>`;
  }

  let html = `<div class="dq-card" data-groupkey="${esc(groupKey)}">
    <div class="dq-title">${subtitleFn(group)}</div>`;
  list.forEach((r, i) => {
    html += `<label class="dq-row dq-radio-row">
      <input type="radio" name="keep-${esc(groupKey)}" value="${r.id}" ${i===0?'checked':''}>
      <span class="dq-radio-label">${esc(r.name)} <span style="color:var(--ink-faint)">&mdash; ${esc(r.village)}${r.mobile?' · '+esc(r.mobile):''}${r.enrollmentNo?' · '+esc(r.enrollmentNo):''}</span></span>
      <button type="button" class="dq-link" data-village="${esc(r.village)}">View &rarr;</button>
    </label>`;
  });
  html += `<div class="dq-actions">
    <button class="dq-btn dq-btn-primary" data-act="merge" data-groupkey="${esc(groupKey)}" data-ids="${idsAttr}">Merge into selected</button>
    <button class="dq-btn" data-act="dismiss" data-groupkey="${esc(groupKey)}" data-ids="${idsAttr}">Not a duplicate</button>
  </div></div>`;
  return html;
}

function renderDataQuality(container){
  const dupEnroll = buildDupGroups('enrollmentNo', 'enr');
  const dupMobile = buildDupGroups('mobile', 'mob');
  const allGroups = [...dupEnroll, ...dupMobile];
  const resolvedCount = allGroups.filter(g => dq.dismissed[g.groupKey]).length;

  let html = `<div class="section-head"><h2>Data Quality Checks</h2></div>
  <p class="dq-note">Automated checks against the master list to help verify correctness before or during outreach. Pick which record to keep, then merge the rest into it (their contacted/leaning status carries over) &mdash; or mark a group as not a duplicate to dismiss it.${allGroups.length ? ` <strong>${resolvedCount} of ${allGroups.length}</strong> flagged groups resolved.` : ''}</p>`;

  html += `<div class="section-head" style="margin-top:24px;"><h2 style="font-size:16px;">Same Enrollment No. listed twice</h2><span class="count">${dupEnroll.length} case${dupEnroll.length===1?'':'s'}</span></div>`;
  if (!dupEnroll.length) {
    html += `<div class="empty">None found.</div>`;
  } else {
    for (const g of dupEnroll) {
      html += dqGroupCard(g, g => `Enrollment <span class="dq-code mono">${esc(g.key)}</span> appears ${g.list.length} times`);
    }
  }

  html += `<div class="section-head" style="margin-top:28px;"><h2 style="font-size:16px;">Same mobile number, different advocates</h2><span class="count">${dupMobile.length} numbers</span></div>
  <p class="dq-note">Often a shared family/office phone &mdash; only merge these if they're genuinely the same person; otherwise mark &ldquo;Not a duplicate&rdquo; so it stops being flagged.</p>`;
  if (!dupMobile.length) {
    html += `<div class="empty">None found.</div>`;
  } else {
    for (const g of dupMobile) {
      html += dqGroupCard(g, g => `Mobile <span class="dq-code mono">${esc(g.key)}</span> shared by ${g.list.length} advocates`);
    }
  }

  container.innerHTML = html;
  container.querySelectorAll('.dq-link').forEach(btn => {
    btn.addEventListener('click', (e) => { e.preventDefault(); location.hash = 'village/' + encodeURIComponent(btn.dataset.village); });
  });
  container.querySelectorAll('[data-act="merge"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const groupKey = btn.dataset.groupkey;
      const ids = btn.dataset.ids.split(',').map(Number);
      const card = btn.closest('.dq-card');
      const checked = card.querySelector('input[type="radio"]:checked');
      const keeperId = Number(checked.value);
      mergeGroup(groupKey, keeperId, ids);
      renderDataQuality(container);
    });
  });
  container.querySelectorAll('[data-act="dismiss"]').forEach(btn => {
    btn.addEventListener('click', () => {
      dismissGroup(btn.dataset.groupkey);
      renderDataQuality(container);
    });
  });
  container.querySelectorAll('[data-act="undo"]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ids = btn.dataset.ids.split(',').map(Number);
      undoGroup(btn.dataset.groupkey, ids);
      renderDataQuality(container);
    });
  });
}

// ---------- master render ----------
function render(){
  const app = document.getElementById('app');
  const tabsDiv = document.getElementById('tabs');
  const crumbBtn = document.getElementById('crumbBtn');
  const subtitle = document.getElementById('subtitleText');
  const search = document.getElementById('searchBox');

  if (currentView === 'village') {
    tabsDiv.style.display = 'none';
    crumbBtn.style.display = 'flex';
    search.disabled = false;
    search.placeholder = 'Search advocates in this village…';
    subtitle.textContent = 'Tap Contacted or a leaning dot to record outreach status. Saved automatically in this browser.';
    renderVillage(app, currentVillage);
  } else {
    tabsDiv.style.display = 'flex';
    crumbBtn.style.display = 'none';
    tabsDiv.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
    if (currentView === 'dataquality') {
      search.placeholder = 'Search not used on this tab';
      search.disabled = true;
      subtitle.textContent = 'Cross-checks to help verify record accuracy across the master list.';
      renderDataQuality(app);
    } else if (currentView === 'records') {
      search.disabled = false;
      search.placeholder = 'Search by name, village, mobile or enrollment no.…';
      subtitle.textContent = `All ${DATA.length.toLocaleString()} advocate records — click a column to sort, or Edit to correct a record.`;
      renderRecords(app);
    } else {
      search.disabled = false;
      search.placeholder = 'Search villages, names, enrollment no. or mobile…';
      subtitle.textContent = `Outreach tracker for ${activeList(DATA).length.toLocaleString()} advocates across ${villageNames.length-1} villages and the Charkhi Dadri city area.`;
      renderOverview(app);
    }
  }
}

document.getElementById('crumbBtn').addEventListener('click', () => { location.hash = ''; });
document.getElementById('tabs').querySelectorAll('.tab').forEach(b => {
  b.addEventListener('click', () => { location.hash = b.dataset.view === 'overview' ? '' : b.dataset.view; });
});

document.getElementById('searchBox').addEventListener('input', (e) => {
  searchText = e.target.value;
  if (currentView === 'village') renderVillage(document.getElementById('app'), currentVillage);
  else if (currentView === 'overview') renderOverview(document.getElementById('app'));
  else if (currentView === 'records') renderRecords(document.getElementById('app'));
});

// ---------- notes modal ----------
let notesOpenId = null;
let notesSaveTimer = null;

function refreshCurrentView(){
  const app = document.getElementById('app');
  if (currentView === 'village') renderVillage(app, currentVillage);
  else if (currentView === 'overview') renderOverview(app);
  else if (currentView === 'dataquality') renderDataQuality(app);
  else if (currentView === 'records') renderRecords(app);
}

function openNotes(id){
  const r = effRec(id);
  if (!r) return;
  notesOpenId = id;
  document.getElementById('notesModalName').textContent = r.name;
  document.getElementById('notesModalMeta').textContent = r.village + (r.mobile ? ' · ' + r.mobile : '');
  const ta = document.getElementById('notesTextarea');
  ta.value = getRec(id).n || '';
  document.getElementById('notesOverlay').hidden = false;
  setTimeout(() => ta.focus(), 0);
}
function closeNotes(){
  if (notesSaveTimer) { clearTimeout(notesSaveTimer); notesSaveTimer = null; }
  saveNoteNow();
  document.getElementById('notesOverlay').hidden = true;
  notesOpenId = null;
  refreshCurrentView();
}
function saveNoteNow(){
  if (notesOpenId == null) return;
  const val = document.getElementById('notesTextarea').value.trim();
  const cur = getRec(notesOpenId);
  state[notesOpenId] = { ...cur, n: val || undefined };
  pruneEmpty(notesOpenId);
  saveState();
}
document.getElementById('notesTextarea').addEventListener('input', () => {
  if (notesSaveTimer) clearTimeout(notesSaveTimer);
  notesSaveTimer = setTimeout(saveNoteNow, 400);
});
document.getElementById('notesModalClose').addEventListener('click', closeNotes);
document.getElementById('notesDoneBtn').addEventListener('click', closeNotes);
document.getElementById('notesClearBtn').addEventListener('click', () => {
  document.getElementById('notesTextarea').value = '';
  saveNoteNow();
});
document.getElementById('notesOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'notesOverlay') closeNotes();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.getElementById('notesOverlay').hidden) closeNotes();
});

// ---------- edit record modal ----------
let editOpenId = null;
const EDIT_FIELDS = [
  ['editName', 'name'], ['editRelation', 'relation'], ['editMobile', 'mobile'],
  ['editEnrollment', 'enrollmentNo'], ['editVillage', 'village'], ['editLocality', 'locality'],
  ['editAddress', 'address'],
];
function openEdit(id){
  const base = byId.get(id);
  if (!base) return;
  editOpenId = id;
  const eff = effRec(id);
  document.getElementById('editModalMeta').textContent = 'Enrollment ' + (base.enrollmentNo || '—') + ' · originally listed under ' + base.village;
  EDIT_FIELDS.forEach(([elId, field]) => {
    document.getElementById(elId).value = eff[field] || '';
  });
  document.getElementById('editHint').textContent = isEdited(id) ? 'This record has edits saved in this browser.' : '';
  document.getElementById('editOverlay').hidden = false;
  setTimeout(() => document.getElementById('editName').focus(), 0);
}
function closeEdit(){
  document.getElementById('editOverlay').hidden = true;
  editOpenId = null;
}
function saveEditNow(){
  if (editOpenId == null) return false;
  const base = byId.get(editOpenId);
  const next = {};
  EDIT_FIELDS.forEach(([elId, field]) => {
    const val = document.getElementById(elId).value.trim();
    if (val !== String(base[field] || '')) next[field] = val;
  });
  if (Object.keys(next).length) edits[editOpenId] = next;
  else delete edits[editOpenId];
  saveEdits();
  buildVillageIndex();
  return true;
}
document.getElementById('editSaveBtn').addEventListener('click', () => {
  saveEditNow();
  closeEdit();
  refreshCurrentView();
});
document.getElementById('editRevertBtn').addEventListener('click', () => {
  if (editOpenId == null) return;
  delete edits[editOpenId];
  saveEdits();
  buildVillageIndex();
  closeEdit();
  refreshCurrentView();
});
document.getElementById('editModalClose').addEventListener('click', () => { closeEdit(); refreshCurrentView(); });
document.getElementById('editOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'editOverlay') { closeEdit(); refreshCurrentView(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !document.getElementById('editOverlay').hidden) { closeEdit(); refreshCurrentView(); }
});

parseHash();
render();
</script>
